<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>捏捏小金鱼 🐠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: linear-gradient(180deg, #0b2b40 0%, #12546f 50%, #08202f 100%);
    display: flex; justify-content: center; align-items: center;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: sans-serif;
    position: relative;
  }

  /* ====== 金鱼区域 ====== */
  .fish-wrapper {
    animation: float 3s ease-in-out infinite;
    position: relative;
    display: flex; justify-content: center; align-items: center;
    width: 300px; height: 200px;
  }
  .fish-container {
    width: 100%; height: 100%;
    cursor: grab;
    transform-origin: center bottom;
    will-change: transform;
  }
  .fish-container:active { cursor: grabbing; }

  /* 水泡装饰 */
  .bubble {
    position: absolute;
    background: rgba(160, 222, 255, 0.15);
    border: 1px solid rgba(190, 235, 255, 0.3);
    border-radius: 50%;
    bottom: -30px;
    animation: rise 4s linear infinite;
  }
  .b1 { left: 10%; width: 10px; height: 10px; animation-delay: 0s; }
  .b2 { left: 30%; width: 15px; height: 15px; animation-delay: 1.5s; }
  .b3 { left: 70%; width: 8px; height: 8px; animation-delay: 0.8s; }
  .b4 { left: 85%; width: 12px; height: 12px; animation-delay: 2.5s; }

  @keyframes rise {
    0% { bottom: -30px; opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    100% { bottom: 110%; opacity: 0; transform: translateX(20px); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* 说话气泡 */
  .speech-bubble {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #FFFFFF;
    color: #333;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    pointer-events: none;
    z-index: 10;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: #FFFFFF transparent transparent;
  }
  .speech-bubble.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  /* 提示文字 */
  .hint {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    color: rgba(200, 235, 255, 0.7); font-size: 14px; letter-spacing: 2px;
    pointer-events: none; white-space: nowrap;
    animation: fadeHint 6s ease forwards;
  }
  @keyframes fadeHint {
    0% { opacity: 0; transform: translate(-50%, 12px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ====== 底部下载按钮区域 ====== */
  .bottom-actions {
    position: fixed;
    bottom: 30px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 100;
  }
  .download-btn {
    padding: 12px 28px;
    border-radius: 30px;
    background: #FFC145;
    color: #333;
    border: none;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .download-btn:active { transform: scale(0.9); }
</style>
</head>
<body>

<div class="fish-wrapper">
  <div class="speech-bubble" id="speechBubble">咕噜咕噜~</div>
  <div class="fish-container" id="fish">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <svg viewBox="0 0 300 200" width="300" height="200">
      <path d="M 80 100 Q 20 20 10 50 Q 40 100 10 150 Q 20 180 80 100" fill="#FF8C42" />
      <path d="M 120 50 Q 160 10 200 50 Z" fill="#FFA855" />
      <path d="M 180 120 Q 220 160 160 160 Z" fill="#FFA855" />
      <ellipse cx="160" cy="100" rx="80" ry="60" fill="#FFC145" />
      <ellipse cx="140" cy="120" rx="50" ry="30" fill="#FFE0A3" opacity="0.6" />
      <circle cx="210" cy="80" r="15" fill="#FFFFFF" />
      <circle cx="215" cy="80" r="8" fill="#2C1A10" />
      <circle cx="218" cy="77" r="3" fill="#FFFFFF" />
      <path d="M 235 105 Q 245 115 235 120" stroke="#CC5500" stroke-width="4" fill="none" stroke-linecap="round" />
      <circle cx="260" cy="60" r="6" fill="none" stroke="#A0E0FF" stroke-width="2" />
      <circle cx="275" cy="40" r="4" fill="none" stroke="#A0E0FF" stroke-width="2" />
    </svg>
  </div>
</div>

<div class="hint">按住小金鱼，捏一捏 ~</div>

<!-- ====== 底部下载按钮区域 ====== -->
<div class="bottom-actions">
  <!-- ⬇️⬇️⬇️ 你提供的蓝奏云解析直链已插入 ⬇️⬇️⬇️ -->

     download="myapp.apk" 
     target="_blank" 
     class="download-btn" 
     id="downloadBtn">
     📥 下载 APK
  </a>
</div>

<script>
  // ====== 捏捏金鱼逻辑 ======
  var fishEl = document.getElementById('fish');
  var speechBubble = document.getElementById('speechBubble');
  var isDown = false;

  var phrases = [
    "捏我干嘛！", "咕噜咕噜~", "好软呀~", "再捏一下！", 
    "嘿嘿！", "别捏啦，会扁的！", "我是小金鱼~", 
    "啵啵啵~", "今天也要开心哦~", "你再捏我要生气了！"
  ];

  function speak() {
    var text = phrases[Math.floor(Math.random() * phrases.length)];
    speechBubble.textContent = text;
    speechBubble.classList.add('show');
    clearTimeout(window.speechTimer);
    window.speechTimer = setTimeout(function() {
      speechBubble.classList.remove('show');
    }, 2000);
  }

  function onDown(e) {
    e.preventDefault();
    if (isDown) return;
    isDown = true;
    fishEl.style.transition = 'transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1)';
    fishEl.style.transform = 'scale(1.15, 0.75) translateY(25px)';
    speak();
  }

  function onUp() {
    if (!isDown) return;
    isDown = false;
    fishEl.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    fishEl.style.transform = 'scale(1, 1) translateY(0)';
  }

  fishEl.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('blur', onUp);
</script>
</body>
</html>
