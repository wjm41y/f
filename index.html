<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 40%, #1a6b8a 0%, #0b2b40 70%, #061924 100%);
    display: flex; justify-content: center; align-items: center;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    position: relative;
  }

  .bg-bubble {
    position: absolute;
    background: rgba(160, 222, 255, 0.08);
    border: 1px solid rgba(190, 235, 255, 0.2);
    border-radius: 50%;
    bottom: -50px;
    animation: rise 8s linear infinite;
    pointer-events: none;
  }
  .bb1 { left: 15%; width: 20px; height: 20px; animation-delay: 0s; }
  .bb2 { left: 50%; width: 30px; height: 30px; animation-delay: 2s; }
  .bb3 { left: 80%; width: 15px; height: 15px; animation-delay: 4s; }
  .bb4 { left: 35%; width: 25px; height: 25px; animation-delay: 6s; }

  @keyframes rise {
    0% { bottom: -50px; opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    100% { bottom: 110%; opacity: 0; transform: translateX(30px); }
  }

  .switch-btn {
    position: fixed;
    top: 30px; right: 20px;
    width: 55px; height: 55px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-size: 26px;
    display: flex; justify-content: center; align-items: center;
    z-index: 999;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: transform 0.2s;
    cursor: pointer;
  }
  .switch-btn:active { transform: scale(0.8) rotate(15deg); }

  .fish-wrapper {
    animation: float 3s ease-in-out infinite;
    position: relative;
    display: flex; justify-content: center; align-items: center;
    width: 320px; height: 220px;
    margin-bottom: 60px;
  }

  .fish {
    width: 320px; height: 220px;
    transform-origin: center bottom;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
  }
  .fish.squish {
    transform: scale(1.15, 0.75) translateY(25px);
    transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .fish-svg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    pointer-events: none;
  }
  .fish-svg.active { display: block; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .speech-bubble {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #FFFFFF;
    color: #333;
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    opacity: 0;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    pointer-events: none;
    z-index: 10;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: #FFFFFF transparent transparent;
  }
  .speech-bubble.pop {
    animation: bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .speech-bubble.fade {
    animation: bubbleFade 0.4s ease forwards;
  }

  @keyframes bubblePop {
    0% { opacity: 0; transform: translateX(-50%) scale(0.3) translateY(20px); }
    70% { opacity: 1; transform: translateX(-50%) scale(1.1) translateY(-5px); }
    100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  }
  @keyframes bubbleFade {
    0% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.8) translateY(-15px); }
  }

  .download-btn {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 32px;
    border-radius: 30px;
    background: #FFC145;
    color: #333;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(255, 193, 69, 0.4);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
    cursor: pointer;
  }
  .download-btn:active { transform: translateX(-50%) scale(0.9); }

  .hint {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    color: rgba(200, 235, 255, 0.5); font-size: 13px; letter-spacing: 2px;
    white-space: nowrap;
    pointer-events: none;
  }
</style>

<script>
  var fishEl = document.getElementById('fish');
  var speechBubble = document.getElementById('speechBubble');
  var switchBtn = document.getElementById('switchBtn');
  var currentFish = 1;
  var isSquished = false;
  var switchLocked = false;

  var fishPhrases = {
    1: ["咕噜咕噜~", "好软呀~", "贴贴~", "最喜欢你了~", "给你吐个泡泡~", "摸摸头好不好嘛~", "今天也要元气满满！", "捏我干嘛！", "好舒服呀~"],
    2: ["嘟嘟嘟~", "我是蓝胖胖！", "看我大眼睛！", "咕噜咕噜~", "我好像...又胖了...", "抱抱你~", "晚安，做个好梦~", "不要戳我眼睛啦！", "我飘了~"],
    3: ["气死我啦！", "别碰我的刺！", "你再捏我要生气了！", "哼，不理你了！", "再捏我就咬你！", "已气成河豚！", "再捏我就变成气球飞走了！", "我超凶的！"]
  };

  var audioCtx = null;
  function playSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
  }

  function speak() {
    var list = fishPhrases[currentFish];
    speechBubble.textContent = list[Math.floor(Math.random() * list.length)];
    speechBubble.classList.remove('pop', 'fade');
    void speechBubble.offsetWidth;
    speechBubble.classList.add('pop');
    clearTimeout(window.speechTimer);
    window.speechTimer = setTimeout(function() {
      speechBubble.classList.remove('pop');
      speechBubble.classList.add('fade');
    }, 1800);
  }

  function squish() {
    if (isSquished) return;
    isSquished = true;
    fishEl.classList.add('squish');
    playSound();
    if (navigator.vibrate) navigator.vibrate(30);
    speak();
  }

  function release() {
    if (!isSquished) return;
    isSquished = false;
    fishEl.classList.remove('squish');
  }

  function isSwitchOrDownload(target) {
    if (!target) return false;
    var el = target.nodeType === 3 ? target.parentNode : target;
    return el && (
      (el.closest && el.closest('.switch-btn')) ||
      (el.closest && el.closest('.download-btn'))
    );
  }

  document.addEventListener('touchstart', function(e) {
    if (isSwitchOrDownload(e.target)) return;
    squish();
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (isSwitchOrDownload(e.target)) return;
    release();
  }, { passive: true });

  document.addEventListener('touchcancel', function(e) {
    if (isSwitchOrDownload(e.target)) return;
    release();
  }, { passive: true });

  document.addEventListener('mousedown', function(e) {
    if (isSwitchOrDownload(e.target)) return;
    squish();
  });

  document.addEventListener('mouseup', function(e) {
    if (isSwitchOrDownload(e.target)) return;
    release();
  });

  function doSwitch() {
    if (switchLocked) return;
    switchLocked = true;
    document.getElementById('fish' + currentFish).classList.remove('active');
    currentFish = currentFish % 3 + 1;
    document.getElementById('fish' + currentFish).classList.add('active');
    playSound();
    speak();
    setTimeout(function() { switchLocked = false; }, 400);
  }

  switchBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    doSwitch();
  });

  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
</script>
</body>
